name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - user-service
          - driver-service
          - admin-service
          - api-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ${{ matrix.service }}/requirements.txt
            requirements-test.txt
      - run: pip install -r ${{ matrix.service }}/requirements.txt -r requirements-test.txt
      - run: python -m pytest ${{ matrix.service }}/tests
