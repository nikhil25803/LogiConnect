name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docker-build:
    name: docker-build / ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - user-service
          - driver-service
          - admin-service
          - api-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  compose-smoke:
    name: compose / migrations-and-smoke
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose up --build -d
      - name: Wait for gateway
        run: |
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:3000/openapi.json >/dev/null && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
      - run: bash scripts/verify-databases.sh
      - run: bash scripts/smoke.sh
      - name: Verify persistence
        run: |
          docker compose restart user-db driver-db admin-db
          test "$(docker compose exec -T user-db psql -U logiconnect_user -d logiconnect_users -Atc 'select count(*) from users')" = "1"
          test "$(docker compose exec -T driver-db psql -U logiconnect_driver -d logiconnect_drivers -Atc 'select count(*) from drivers')" = "1"
          test "$(docker compose exec -T admin-db psql -U logiconnect_admin -d logiconnect_admin -Atc 'select count(*) from vehicles')" = "1"
      - name: Verify fresh start
        run: |
          docker compose down --volumes --remove-orphans
          docker compose up -d
          test "$(docker compose exec -T user-db psql -U logiconnect_user -d logiconnect_users -Atc 'select count(*) from users')" = "0"
          test "$(docker compose exec -T driver-db psql -U logiconnect_driver -d logiconnect_drivers -Atc 'select count(*) from drivers')" = "0"
          test "$(docker compose exec -T admin-db psql -U logiconnect_admin -d logiconnect_admin -Atc 'select count(*) from vehicles')" = "0"
      - if: always()
        run: docker compose down --volumes --remove-orphans
