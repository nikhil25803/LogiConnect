x-service-environment: &service-environment
  REDIS_HOST: redis
  REDIS_PORT: 6379
  SECRET_KEY: ${SECRET_KEY}
  ALGORITHM: ${ALGORITHM}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
  CELERY_BROKER: ${CELERY_BROKER}
  CELERY_BACKEND: ${CELERY_BACKEND}
  GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
  ADMIN_EMAIL: ${ADMIN_EMAIL}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD}
  INTERNAL_API_KEY: ${INTERNAL_API_KEY}
  USER_SERVICE_URL: http://user-service:3001
  DRIVER_SERVICE_URL: http://driver-service:3002
  ADMIN_SERVICE_URL: http://admin-service:3003

services:
  user-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${USER_DB_USER}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
      POSTGRES_DB: ${USER_DB_NAME}
    ports: ["${USER_DB_HOST_PORT:-5432}:5432"]
    volumes: [user-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER_DB_USER} -d ${USER_DB_NAME}"]
      interval: 3s
      timeout: 5s
      retries: 15

  driver-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DRIVER_DB_USER}
      POSTGRES_PASSWORD: ${DRIVER_DB_PASSWORD}
      POSTGRES_DB: ${DRIVER_DB_NAME}
    ports: ["${DRIVER_DB_HOST_PORT:-5433}:5432"]
    volumes: [driver-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DRIVER_DB_USER} -d ${DRIVER_DB_NAME}"]
      interval: 3s
      timeout: 5s
      retries: 15

  admin-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${ADMIN_DB_USER}
      POSTGRES_PASSWORD: ${ADMIN_DB_PASSWORD}
      POSTGRES_DB: ${ADMIN_DB_NAME}
    ports: ["${ADMIN_DB_HOST_PORT:-5434}:5432"]
    volumes: [admin-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ADMIN_DB_USER} -d ${ADMIN_DB_NAME}"]
      interval: 3s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    ports: ["${REDIS_HOST_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 15

  user-migrate:
    build: ./user-service
    command: alembic upgrade head
    environment:
      <<: *service-environment
      DB_URL: postgresql+asyncpg://${USER_DB_USER}:${USER_DB_PASSWORD}@user-db:5432/${USER_DB_NAME}
    depends_on:
      user-db: {condition: service_healthy}

  driver-migrate:
    build: ./driver-service
    command: alembic upgrade head
    environment:
      <<: *service-environment
      DB_URL: postgresql+asyncpg://${DRIVER_DB_USER}:${DRIVER_DB_PASSWORD}@driver-db:5432/${DRIVER_DB_NAME}
    depends_on:
      driver-db: {condition: service_healthy}

  admin-migrate:
    build: ./admin-service
    command: alembic upgrade head
    environment:
      <<: *service-environment
      DB_URL: postgresql+asyncpg://${ADMIN_DB_USER}:${ADMIN_DB_PASSWORD}@admin-db:5432/${ADMIN_DB_NAME}
    depends_on:
      admin-db: {condition: service_healthy}

  user-service:
    build: ./user-service
    ports: ["${USER_SERVICE_HOST_PORT:-3001}:3001"]
    environment:
      <<: *service-environment
      DB_URL: postgresql+asyncpg://${USER_DB_USER}:${USER_DB_PASSWORD}@user-db:5432/${USER_DB_NAME}
    depends_on:
      user-migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  driver-service:
    build: ./driver-service
    ports: ["${DRIVER_SERVICE_HOST_PORT:-3002}:3002"]
    environment:
      <<: *service-environment
      DB_URL: postgresql+asyncpg://${DRIVER_DB_USER}:${DRIVER_DB_PASSWORD}@driver-db:5432/${DRIVER_DB_NAME}
    depends_on:
      driver-migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  admin-service:
    build: ./admin-service
    ports: ["${ADMIN_SERVICE_HOST_PORT:-3003}:3003"]
    environment:
      <<: *service-environment
      DB_URL: postgresql+asyncpg://${ADMIN_DB_USER}:${ADMIN_DB_PASSWORD}@admin-db:5432/${ADMIN_DB_NAME}
    depends_on:
      admin-migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  api-gateway:
    build: ./api-gateway
    ports: ["${API_GATEWAY_HOST_PORT:-3000}:3000"]
    environment:
      USER_SERVICE_URL: http://user-service:3001
      DRIVER_SERVICE_URL: http://driver-service:3002
      ADMIN_SERVICE_URL: http://admin-service:3003
    depends_on:
      - user-service
      - driver-service
      - admin-service

volumes:
  user-db-data:
  driver-db-data:
  admin-db-data:
